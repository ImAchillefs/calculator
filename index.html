<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Calculator</title>
		<link rel="stylesheet" href="styles.css">
	</head>
	<body>
		<div class="calcultor">
			<div class="output-container">
				<input id="output" class="output" placeholder="0"></input>
			</div>
			<div class="buttons-container">
				<div class="buttons-row">
					<div id="del" class="button">del</div>
					<div id="ac" class="button">AC</div>
					<div id="perc" class="button equation">%</div>
					<div id="div" class="button equation">/</div>
				</div>
				<div class="buttons-row">
					<div class="button number">7</div>
					<div class="button number">8</div>
					<div class="button number">9</div>
					<div id="multi" class="button equation">*</div>
				</div>
				<div class="buttons-row">
					<div class="button number">4</div>
					<div class="button number">5</div>
					<div class="button number">6</div>
					<div id="minus" class="button equation">-</div>
				</div>
				<div class="buttons-row">
					<div class="button number">1</div>
					<div class="button number">2</div>
					<div class="button number">3</div>
					<div id="plus" class="button equation">+</div>
				</div>
				<div class="buttons-row">
					<div id="extra" class="button">()</div>
					<div class="button number">0</div>
					<div id="decimal" class="button equation">.</div>
					<div id="equal" class="button">=</div>
				</div>
			</div>
		</div>
	</body>
	<footer>
		<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjs/15.3.0/math.js'></script>
		<script src='index.js'></script>
	</footer>
</html>
